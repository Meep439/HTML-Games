<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swarm Survivor — Endless Wrap</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080c;color:#fff;font-family:Arial,sans-serif}
canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
#hud{position:fixed;left:16px;top:14px;z-index:3;pointer-events:none;text-shadow:0 2px 5px #000;font-weight:bold;line-height:1.45}
#help{position:fixed;right:16px;top:14px;z-index:3;text-align:right;opacity:.85;font-size:13px;pointer-events:none;text-shadow:0 2px 4px #000}
#message{position:fixed;left:50%;top:17%;transform:translateX(-50%);z-index:4;font-size:22px;font-weight:bold;text-shadow:0 2px 5px #000;opacity:0;transition:opacity .15s;pointer-events:none}
#start,#gameover{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(2,4,7,.82);backdrop-filter:blur(4px)}
#gameover{display:none}
.panel{background:#101720;border:1px solid #34465c;border-radius:15px;padding:28px 36px;text-align:center;box-shadow:0 20px 70px #000;max-width:540px}
h1{margin:0 0 10px;font-size:40px}
p{color:#bbc7d6;line-height:1.5}
button{border:0;border-radius:9px;padding:12px 24px;background:#4da3ff;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.15)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="help">WASD / Arrow Keys: Move<br>Mouse: Aim & Shoot<br>R: Restart</div>
<div id="message"></div>

<div id="start">
  <div class="panel">
    <h1>SWARM SURVIVOR</h1>
    <p>Top-down survival in an endless-looking world. The map wraps around at every edge.</p>
    <p>You have <b>3 lives</b>, limited ammo, enemy drops, and a large bright flashlight cone.</p>
    <button id="startBtn">START GAME</button>
  </div>
</div>

<div id="gameover">
  <div class="panel">
    <h1>GAME OVER</h1>
    <p id="final"></p>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
let W,H,dpr;
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",resize);resize();

const keys={},mouse={x:W/2,y:H/2,down:false};
addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==="r"&&!running)startGame();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
canvas.addEventListener("mousedown",()=>mouse.down=true);
addEventListener("mouseup",()=>mouse.down=false);
document.getElementById("startBtn").onclick=startGame;
document.getElementById("restartBtn").onclick=startGame;

const WORLD_W=2600,WORLD_H=1800;
let player,enemies,bullets,particles,drops,running=false,last=0;
let spawnTimer=0,shootCooldown=0,score=0,kills=0,wave=1,time=0,enemyId=0,msgTimer=0;

function wrap(v,max){return ((v%max)+max)%max}
function delta(a,b,size){
  let d=a-b;
  if(d>size/2)d-=size;
  if(d<-size/2)d+=size;
  return d;
}
function dist(ax,ay,bx,by){
  return Math.hypot(delta(ax,bx,WORLD_W),delta(ay,by,WORLD_H));
}
function angleTo(ax,ay,bx,by){
  return Math.atan2(delta(by,ay,WORLD_H),delta(bx,ax,WORLD_W));
}

function startGame(){
  player={
    x:WORLD_W/2,y:WORLD_H/2,r:16,speed:285,
    hp:100,maxHp:100,lives:3,ammo:90,maxAmmo:120,
    angle:0,invuln:0,rapid:0
  };
  enemies=[];bullets=[];particles=[];drops=[];
  running=true;score=0;kills=0;wave=1;time=0;
  spawnTimer=.5;shootCooldown=0;enemyId=0;msgTimer=0;
  document.getElementById("start").style.display="none";
  document.getElementById("gameover").style.display="none";
  last=performance.now();
  requestAnimationFrame(loop);
}

function showMessage(text){
  const el=document.getElementById("message");
  el.textContent=text;el.style.opacity=1;msgTimer=1.4;
}

function spawnPoint(){
  const a=Math.random()*Math.PI*2;
  const d=Math.max(W,H)*.7+Math.random()*350;
  return {
    x:wrap(player.x+Math.cos(a)*d,WORLD_W),
    y:wrap(player.y+Math.sin(a)*d,WORLD_H)
  };
}

function spawnEnemy(){
  const p=spawnPoint();
  const roll=Math.random();
  let type="grunt";
  if(roll<Math.min(.13+wave*.006,.25))type="tank";
  else if(roll<Math.min(.40+wave*.01,.56))type="runner";

  const d={
    grunt:{r:14,hp:38+wave*4,speed:72+wave*1.5,damage:14,value:10},
    runner:{r:10,hp:25+wave*2,speed:125+wave*2,damage:9,value:16},
    tank:{r:22,hp:135+wave*13,speed:43+wave*.7,damage:25,value:30}
  }[type];

  enemies.push({...p,...d,type,hit:0,id:enemyId++});
}

function spawnDrop(x,y){
  const roll=Math.random();
  if(roll<.44)drops.push({x,y,r:12,type:"ammo",life:15});
  else if(roll<.58)drops.push({x,y,r:12,type:"health",life:15});
  else if(roll<.70)drops.push({x,y,r:12,type:"rapid",life:15});
  else if(roll<.76)drops.push({x,y,r:12,type:"armor",life:15});
}

function burst(x,y,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=45+Math.random()*180;
    particles.push({
      x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:.3+Math.random()*.45,r:2+Math.random()*3
    });
  }
}

function shoot(){
  if(shootCooldown>0||player.ammo<=0)return;
  const a=player.angle;
  player.ammo--;
  bullets.push({
    x:wrap(player.x+Math.cos(a)*25,WORLD_W),
    y:wrap(player.y+Math.sin(a)*25,WORLD_H),
    vx:Math.cos(a)*760,vy:Math.sin(a)*760,
    r:4,life:1.2,damage:42
  });
  shootCooldown=player.rapid>0?.055:.13;
  if(player.ammo===0)showMessage("OUT OF AMMO — FIND A DROP!");
}

function damagePlayer(amount){
  if(player.invuln>0)return;
  player.hp-=amount;
  player.invuln=.7;
  burst(player.x,player.y,8);

  if(player.hp<=0){
    player.lives--;
    if(player.lives<=0){endGame();return}
    player.hp=player.maxHp;
    player.ammo=Math.min(player.maxAmmo,player.ammo+35);
    player.invuln=2;
    enemies.length=Math.max(0,enemies.length-4);
    showMessage("LIFE LOST — "+player.lives+" LEFT");
  }
}

function update(dt){
  time+=dt;
  wave=1+Math.floor(time/20);

  if(msgTimer>0){
    msgTimer-=dt;
    if(msgTimer<=0)document.getElementById("message").style.opacity=0;
  }

  player.invuln=Math.max(0,player.invuln-dt);
  player.rapid=Math.max(0,player.rapid-dt);

  let dx=0,dy=0;
  if(keys.w||keys.arrowup)dy--;
  if(keys.s||keys.arrowdown)dy++;
  if(keys.a||keys.arrowleft)dx--;
  if(keys.d||keys.arrowright)dx++;

  if(dx||dy){
    const len=Math.hypot(dx,dy);
    dx/=len;dy/=len;
    player.x=wrap(player.x+dx*player.speed*dt,WORLD_W);
    player.y=wrap(player.y+dy*player.speed*dt,WORLD_H);
  }

  player.angle=Math.atan2(mouse.y-H/2,mouse.x-W/2);
  if(mouse.down)shoot();
  shootCooldown=Math.max(0,shootCooldown-dt);

  const spawnRate=Math.max(.11,.72-wave*.028);
  spawnTimer-=dt;
  if(spawnTimer<=0){
    spawnEnemy();
    if(wave>5&&Math.random()<.18)spawnEnemy();
    spawnTimer=spawnRate;
  }

  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x=wrap(b.x+b.vx*dt,WORLD_W);
    b.y=wrap(b.y+b.vy*dt,WORLD_H);
    b.life-=dt;
    let remove=b.life<=0;

    if(!remove){
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(dist(b.x,b.y,e.x,e.y)<b.r+e.r){
          e.hp-=b.damage;e.hit=.08;remove=true;burst(b.x,b.y,3);
          if(e.hp<=0){
            score+=e.value;kills++;
            spawnDrop(e.x,e.y);
            burst(e.x,e.y,e.type==="tank"?18:9);
            enemies.splice(j,1);
          }
          break;
        }
      }
    }
    if(remove)bullets.splice(i,1);
  }

  for(const e of enemies){
    const a=angleTo(e.x,e.y,player.x,player.y);
    e.x=wrap(e.x+Math.cos(a)*e.speed*dt,WORLD_W);
    e.y=wrap(e.y+Math.sin(a)*e.speed*dt,WORLD_H);
    e.hit=Math.max(0,e.hit-dt);

    const d=dist(player.x,player.y,e.x,e.y);
    if(d<player.r+e.r){
      damagePlayer(e.damage*dt);
      const push=2;
      e.x=wrap(e.x-Math.cos(a)*push,WORLD_W);
      e.y=wrap(e.y-Math.sin(a)*push,WORLD_H);
    }
  }

  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i];
    d.life-=dt;
    if(d.life<=0){drops.splice(i,1);continue}

    if(dist(player.x,player.y,d.x,d.y)<player.r+d.r){
      if(d.type==="ammo"){
        player.ammo=Math.min(player.maxAmmo,player.ammo+30);
        showMessage("+30 AMMO");
      }else if(d.type==="health"){
        player.hp=Math.min(player.maxHp,player.hp+35);
        showMessage("+35 HEALTH");
      }else if(d.type==="rapid"){
        player.rapid=7;
        showMessage("RAPID FIRE!");
      }else{
        player.invuln=4;
        showMessage("ARMOR SHIELD!");
      }
      burst(d.x,d.y,10);
      drops.splice(i,1);
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x=wrap(p.x+p.vx*dt,WORLD_W);
    p.y=wrap(p.y+p.vy*dt,WORLD_H);
    p.vx*=.96;p.vy*=.96;p.life-=dt;
    if(p.life<=0)particles.splice(i,1);
  }
}

function screenPos(wx,wy){
  let sx=delta(wx,player.x,WORLD_W)+W/2;
  let sy=delta(wy,player.y,WORLD_H)+H/2;
  return [sx,sy];
}

function drawWorld(){
  ctx.fillStyle="#081016";
  ctx.fillRect(0,0,W,H);

  // Infinite-looking tiled terrain.
  const tile=80;
  const ox=((W/2)-player.x)%tile;
  const oy=((H/2)-player.y)%tile;

  ctx.fillStyle="#101a20";
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle="rgba(130,165,180,.09)";
  ctx.lineWidth=1;
  for(let x=ox;x<W;x+=tile){
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  }
  for(let y=oy;y<H;y+=tile){
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }

  // Scattered terrain landmarks that repeat seamlessly.
  const baseX=Math.floor(player.x/280);
  const baseY=Math.floor(player.y/220);

  for(let ix=baseX-5;ix<=baseX+5;ix++){
    for(let iy=baseY-5;iy<=baseY+5;iy++){
      let seed=Math.abs((ix*928371+iy*123457)%100000);
      if(seed%7!==0)continue;
      let wx=wrap(ix*280+(seed%180),WORLD_W);
      let wy=wrap(iy*220+((seed/10)%130),WORLD_H);
      const [sx,sy]=screenPos(wx,wy);

      ctx.fillStyle="#17252b";
      ctx.fillRect(sx-18,sy-18,36,36);
      ctx.strokeStyle="#273b43";
      ctx.strokeRect(sx-18,sy-18,36,36);
      ctx.fillStyle="#1e3035";
      ctx.fillRect(sx-8,sy-28,16,10);
    }
  }
}

function drawEntities(){
  for(const d of drops){
    const [sx,sy]=screenPos(d.x,d.y);
    if(sx<-40||sx>W+40||sy<-40||sy>H+40)continue;

    ctx.save();ctx.translate(sx,sy);
    ctx.rotate(Math.PI/4);
    ctx.fillStyle=d.type==="ammo"?"#ffd34e":
                 d.type==="health"?"#55e38a":
                 d.type==="rapid"?"#cc75ff":"#56c8ff";
    ctx.fillRect(-d.r,-d.r,d.r*2,d.r*2);
    ctx.restore();

    ctx.fillStyle="#fff";ctx.font="bold 11px Arial";
    ctx.textAlign="center";
    ctx.fillText(d.type==="ammo"?"A":d.type==="health"?"+":d.type==="rapid"?"R":"S",sx,sy+4);
  }

  for(const b of bullets){
    const [sx,sy]=screenPos(b.x,b.y);
    if(sx<-20||sx>W+20||sy<-20||sy>H+20)continue;
    ctx.beginPath();ctx.arc(sx,sy,b.r,0,Math.PI*2);
    ctx.fillStyle="#ffe28a";ctx.fill();
  }

  for(const e of enemies){
    const [sx,sy]=screenPos(e.x,e.y);
    if(sx<-60||sx>W+60||sy<-60||sy>H+60)continue;

    ctx.save();ctx.translate(sx,sy);
    ctx.rotate(angleTo(e.x,e.y,player.x,player.y));
    ctx.fillStyle=e.hit>0?"#fff":"#e94f5f";

    if(e.type==="tank"){
      ctx.fillRect(-e.r,-e.r,e.r*2,e.r*2);
      ctx.fillStyle="#8d1e2b";
      ctx.fillRect(-e.r*.45,-e.r*.45,e.r*.9,e.r*.9);
    }else if(e.type==="runner"){
      ctx.beginPath();
      ctx.moveTo(e.r,0);ctx.lineTo(-e.r,-e.r*.75);ctx.lineTo(-e.r,e.r*.75);
      ctx.closePath();ctx.fill();
    }else{
      ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#ff9ba4";
      ctx.beginPath();ctx.arc(4,-3,3,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  // Player stays centered while the world moves around them.
  const px=W/2,py=H/2;
  if(player.invuln<=0||Math.floor(player.invuln*12)%2===0){
    ctx.save();ctx.translate(px,py);ctx.rotate(player.angle);
    ctx.fillStyle="#58b4ff";
    ctx.beginPath();ctx.arc(0,0,player.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#dff4ff";
    ctx.fillRect(5,-5,25,10);
    ctx.restore();
  }

  for(const p of particles){
    const [sx,sy]=screenPos(p.x,p.y);
    if(sx<-20||sx>W+20||sy<-20||sy>H+20)continue;
    ctx.globalAlpha=Math.max(0,p.life*2);
    ctx.fillStyle="#ffb84d";
    ctx.beginPath();ctx.arc(sx,sy,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawFlashlight(){
  const px=W/2,py=H/2;
  const angle=player.angle;

  // Dark world overlay.
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.90)";
  ctx.fillRect(0,0,W,H);

  // Large, bright 120-degree flashlight cone.
  // This is 60 degrees to either side of the mouse aim.
  const halfAngle=Math.PI/3;
  const radius=Math.max(W,H)*1.35;

  // Outer soft glow.
  const gradient=ctx.createRadialGradient(px,py,20,px,py,radius);
  gradient.addColorStop(0,"rgba(255,248,205,.28)");
  gradient.addColorStop(.28,"rgba(255,242,190,.13)");
  gradient.addColorStop(1,"rgba(255,235,170,0)");
  ctx.globalCompositeOperation="lighter";
  ctx.fillStyle=gradient;
  ctx.beginPath();
  ctx.moveTo(px,py);
  ctx.arc(px,py,radius,angle-halfAngle,angle+halfAngle);
  ctx.closePath();
  ctx.fill();

  // Bright inner cone.
  ctx.globalCompositeOperation="destination-out";
  ctx.beginPath();
  ctx.moveTo(px,py);
  ctx.arc(px,py,radius*.96,angle-halfAngle,angle+halfAngle);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Bright center glow.
  const g=ctx.createRadialGradient(px,py,2,px,py,105);
  g.addColorStop(0,"rgba(255,255,220,.30)");
  g.addColorStop(1,"rgba(255,255,220,0)");
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(px,py,105,0,Math.PI*2);ctx.fill();
}

function draw(){
  drawWorld();
  drawEntities();
  drawFlashlight();

  const hp=Math.max(0,player.hp);
  document.getElementById("hud").innerHTML=
    `Wave ${wave} &nbsp;|&nbsp; Score ${score} &nbsp;|&nbsp; Kills ${kills}<br>`+
    `Lives: ${"♥".repeat(player.lives)}${"♡".repeat(3-player.lives)} &nbsp;|&nbsp; Ammo: ${player.ammo}/${player.maxAmmo}<br>`+
    `HP: ${Math.ceil(hp)}/${player.maxHp}`+
    (player.rapid>0?` &nbsp;|&nbsp; Rapid Fire: ${player.rapid.toFixed(1)}s`:"");
}

function endGame(){
  running=false;
  document.getElementById("final").textContent=
    `You reached wave ${wave}, got ${kills} kills, and scored ${score}.`;
  document.getElementById("gameover").style.display="flex";
}

function loop(now){
  if(!running)return;
  const dt=Math.min((now-last)/1000,.033);
  last=now;update(dt);draw();
  requestAnimationFrame(loop);
}
draw();
</script>
</body>
</html>
