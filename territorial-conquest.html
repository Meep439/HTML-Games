<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territorial Conquest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .menu-screen {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .menu-screen h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .menu-screen p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #764ba2;
        }

        .difficulty-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: space-around;
        }

        .difficulty-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .difficulty-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .start-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .game-container {
            display: none;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
        }

        .game-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-info {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .info-value {
            font-size: 1.3em;
            font-weight: bold;
        }

        .exit-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .exit-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .game-content {
            display: flex;
            height: 600px;
        }

        #gameCanvas {
            flex: 1;
            border-right: 2px solid #ddd;
            background: #f5f5f5;
            cursor: crosshair;
        }

        .leaderboard {
            width: 250px;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
        }

        .leaderboard h3 {
            color: #667eea;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .leaderboard-entry {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: white;
            border-left: 4px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
        }

        .leaderboard-entry.player {
            border-left-color: #667eea;
            background: #f0f4ff;
            font-weight: bold;
        }

        .player-name {
            flex: 1;
            word-break: break-word;
        }

        .player-percent {
            font-weight: bold;
            min-width: 50px;
            text-align: right;
        }

        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            margin-right: 8px;
        }

        .game-over-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .modal-content.victory h2 {
            color: #4caf50;
        }

        .modal-content.defeat h2 {
            color: #f44336;
        }

        .exp-earned {
            font-size: 1.5em;
            color: #ffc107;
            font-weight: bold;
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .rank-info {
            color: #666;
            margin: 15px 0;
            font-size: 1.1em;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn.play-again {
            background: #667eea;
            color: white;
        }

        .modal-btn.play-again:hover {
            background: #764ba2;
        }

        .modal-btn.menu {
            background: #ddd;
            color: #333;
        }

        .modal-btn.menu:hover {
            background: #ccc;
        }

        .status-bar {
            background: #f5f5f5;
            padding: 15px 20px;
            border-top: 1px solid #ddd;
            font-size: 0.9em;
            color: #666;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .game-content {
                flex-direction: column;
                height: auto;
            }

            #gameCanvas {
                border-right: none;
                border-bottom: 2px solid #ddd;
                height: 400px;
                width: 100%;
            }

            .leaderboard {
                width: 100%;
                max-height: 300px;
            }

            .menu-screen {
                padding: 20px;
            }

            .menu-screen h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <!-- Menu Screen -->
    <div class="menu-screen" id="menuScreen">
        <h1>⚔️ Territorial Conquest</h1>
        <p>Expand your territory and dominate the world!</p>
        
        <div class="input-group">
            <label for="playerName">Your Username:</label>
            <input type="text" id="playerName" placeholder="Enter your name" maxlength="20">
        </div>

        <div class="input-group">
            <label>Difficulty Level:</label>
            <div class="difficulty-group">
                <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
                <button class="difficulty-btn" data-difficulty="normal">Normal</button>
                <button class="difficulty-btn" data-difficulty="hard">Hard</button>
            </div>
        </div>

        <button class="start-btn" id="startBtn">Start Game</button>
    </div>

    <!-- Game Screen -->
    <div class="game-container" id="gameContainer">
        <div class="game-header">
            <div class="header-info">
                <div class="info-item">
                    <span class="info-label">Your Territory</span>
                    <span class="info-value" id="playerTerritory">0%</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Experience</span>
                    <span class="info-value" id="playerExp">0 XP</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Rank</span>
                    <span class="info-value" id="playerRank">-</span>
                </div>
            </div>
            <button class="exit-btn" id="exitBtn">Exit Game</button>
        </div>

        <div class="game-content">
            <canvas id="gameCanvas"></canvas>
            <div class="leaderboard">
                <h3>Leaderboard</h3>
                <div id="leaderboardList"></div>
            </div>
        </div>

        <div class="status-bar">
            <span id="statusMessage">Game started! Click to expand your territory.</span>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="game-over-modal" id="gameOverModal">
        <div class="modal-content" id="modalContent">
            <h2 id="gameOverTitle">Game Over</h2>
            <div class="rank-info" id="rankInfo"></div>
            <div class="exp-earned" id="expEarned"></div>
            <div class="modal-buttons">
                <button class="modal-btn play-again" id="playAgainBtn">Play Again</button>
                <button class="modal-btn menu" id="menuBtn">Main Menu</button>
            </div>
        </div>
    </div>

    <script>
        // Game Configuration
        const BOT_NAMES = [
            'Shadow', 'Phoenix', 'Titan', 'Cipher', 'Vortex',
            'Nexus', 'Storm', 'Rogue', 'Apex', 'Blaze',
            'Echo', 'Inferno', 'Specter', 'Zenith', 'Surge'
        ];

        const DIFFICULTY_SETTINGS = {
            easy: { bots: 3, botSkill: 0.4, botExpansionSpeed: 0.015 },
            normal: { bots: 5, botSkill: 0.6, botExpansionSpeed: 0.025 },
            hard: { bots: 7, botSkill: 0.85, botExpansionSpeed: 0.035 }
        };

        // Game State
        let gameState = {
            isRunning: false,
            difficulty: 'normal',
            playerName: '',
            playerColor: null,
            selectedCells: new Set(),
            players: [],
            cells: [],
            width: 0,
            height: 0,
            cellSize: 0,
            totalCells: 0
        };

        let canvas, ctx;
        let animationId;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setupMenu();
            setupGame();
        });

        function setupMenu() {
            const startBtn = document.getElementById('startBtn');
            const playerNameInput = document.getElementById('playerName');
            const difficultyBtns = document.querySelectorAll('.difficulty-btn');

            difficultyBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    difficultyBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    gameState.difficulty = btn.dataset.difficulty;
                });
            });

            startBtn.addEventListener('click', () => {
                const playerName = playerNameInput.value.trim();
                if (!playerName) {
                    alert('Please enter a username!');
                    return;
                }
                gameState.playerName = playerName;
                startGame();
            });

            playerNameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') startBtn.click();
            });
        }

        function setupGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            document.getElementById('exitBtn').addEventListener('click', exitGame);
            document.getElementById('playAgainBtn').addEventListener('click', () => {
                document.getElementById('gameOverModal').style.display = 'none';
                startGame();
            });
            document.getElementById('menuBtn').addEventListener('click', returnToMenu);

            // Resize canvas and start game when visible
            window.addEventListener('resize', resizeCanvas);
        }

        function resizeCanvas() {
            if (!gameState.isRunning) return;
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            initializeGameBoard();
        }

        function startGame() {
            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'flex';
            
            gameState.isRunning = true;
            resizeCanvas();
            setupGamePlayers();
            setupGameControls();
            gameLoop();
        }

        function initializeGameBoard() {
            gameState.width = canvas.width;
            gameState.height = canvas.height;
            gameState.cellSize = 30;
            gameState.cols = Math.ceil(gameState.width / gameState.cellSize);
            gameState.rows = Math.ceil(gameState.height / gameState.cellSize);
            gameState.totalCells = gameState.cols * gameState.rows;

            // Initialize cells if first time
            if (gameState.cells.length === 0) {
                gameState.cells = Array(gameState.rows * gameState.cols).fill(null);
                
                // Distribute starting territories
                const startCells = Math.max(5, Math.floor(gameState.totalCells / (gameState.players.length * 8)));
                gameState.players.forEach(player => {
                    for (let i = 0; i < startCells; i++) {
                        const randomCell = Math.floor(Math.random() * gameState.totalCells);
                        gameState.cells[randomCell] = player.id;
                    }
                });
            }
        }

        function setupGamePlayers() {
            gameState.players = [];
            gameState.selectedCells.clear();

            const colors = [
                '#667eea', // Player
                '#ff6b6b', '#4ecdc4', '#45b7d1', '#f39c12',
                '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'
            ];

            // Player
            gameState.playerColor = colors[0];
            gameState.players.push({
                id: 0,
                name: gameState.playerName,
                color: colors[0],
                isBot: false,
                rank: 1,
                exp: 0
            });

            // Bots
            const settings = DIFFICULTY_SETTINGS[gameState.difficulty];
            for (let i = 0; i < settings.bots; i++) {
                const botName = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
                gameState.players.push({
                    id: i + 1,
                    name: botName,
                    color: colors[(i + 1) % colors.length],
                    isBot: true,
                    skill: settings.botSkill,
                    expansionSpeed: settings.botExpansionSpeed,
                    lastExpansion: 0,
                    rank: 1,
                    exp: 0
                });
            }
        }

        function setupGameControls() {
            canvas.addEventListener('click', (e) => {
                if (!gameState.isRunning) return;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const col = Math.floor(x / gameState.cellSize);
                const row = Math.floor(y / gameState.cellSize);
                const cellIndex = row * gameState.cols + col;

                if (cellIndex >= 0 && cellIndex < gameState.cells.length) {
                    expandTerritory(cellIndex);
                }
            });
        }

        function expandTerritory(targetCell) {
            if (gameState.cells[targetCell] === 0) return; // Already owned

            const col = targetCell % gameState.cols;
            const row = Math.floor(targetCell / gameState.cols);

            // Check if adjacent to player territory
            let isAdjacent = false;
            const adjacentCells = getAdjacentCells(row, col);
            for (let adj of adjacentCells) {
                if (gameState.cells[adj] === 0) {
                    isAdjacent = true;
                    break;
                }
            }

            if (isAdjacent || gameState.selectedCells.size === 0) {
                gameState.cells[targetCell] = 0;
            }
        }

        function getAdjacentCells(row, col) {
            const adjacent = [];
            for (let r = -1; r <= 1; r++) {
                for (let c = -1; c <= 1; c++) {
                    if (r === 0 && c === 0) continue;
                    const newRow = row + r;
                    const newCol = col + c;
                    if (newRow >= 0 && newRow < gameState.rows && newCol >= 0 && newCol < gameState.cols) {
                        adjacent.push(newRow * gameState.cols + newCol);
                    }
                }
            }
            return adjacent;
        }

        function botExpand(bot) {
            const now = Date.now();
            if (now - bot.lastExpansion < 100) return;
            bot.lastExpansion = now;

            // Find cells owned by bot
            const botCells = [];
            for (let i = 0; i < gameState.cells.length; i++) {
                if (gameState.cells[i] === bot.id) {
                    botCells.push(i);
                }
            }

            if (botCells.length === 0) return;

            // Random bot cells to try expanding from
            const attempts = Math.ceil(botCells.length * bot.expansionSpeed);
            for (let i = 0; i < attempts; i++) {
                const botCell = botCells[Math.floor(Math.random() * botCells.length)];
                const row = Math.floor(botCell / gameState.cols);
                const col = botCell % gameState.cols;
                const adjacent = getAdjacentCells(row, col);

                const targetCell = adjacent[Math.floor(Math.random() * adjacent.length)];
                if (Math.random() < bot.skill) {
                    gameState.cells[targetCell] = bot.id;
                }
            }
        }

        function updatePlayerRanks() {
            // Calculate territory percentage for each player
            const territoryCounts = {};
            gameState.players.forEach(p => terroryCounts[p.id] = 0);

            gameState.cells.forEach(cellOwner => {
                if (cellOwner !== null) {
                    territoryCounts[cellOwner]++;
                }
            });

            // Sort players by territory
            const sortedPlayers = [...gameState.players].sort((a, b) => {
                return (territoryCounts[b.id] || 0) - (territoryCounts[a.id] || 0);
            });

            sortedPlayers.forEach((player, index) => {
                player.rank = index + 1;
            });
        }

        function getPlayerStats() {
            const stats = {};
            gameState.players.forEach(p => stats[p.id] = 0);

            gameState.cells.forEach(cellOwner => {
                if (cellOwner !== null) stats[cellOwner]++;
            });

            return stats;
        }

        function updateLeaderboard() {
            const stats = getPlayerStats();
            const leaderboardList = document.getElementById('leaderboardList');
            leaderboardList.innerHTML = '';

            const sorted = [...gameState.players].sort((a, b) => {
                return (stats[b.id] || 0) - (stats[a.id] || 0);
            });

            sorted.forEach((player, index) => {
                const count = stats[player.id] || 0;
                const percentage = ((count / gameState.totalCells) * 100).toFixed(1);
                
                const entry = document.createElement('div');
                entry.className = 'leaderboard-entry' + (player.isBot ? '' : ' player');
                entry.innerHTML = `
                    <div style="display: flex; align-items: center; flex: 1; min-width: 0;">
                        <div class="color-box" style="background: ${player.color}; flex-shrink: 0;"></div>
                        <div class="player-name">${index + 1}. ${player.name}</div>
                    </div>
                    <div class="player-percent">${percentage}%</div>
                `;
                leaderboardList.appendChild(entry);
            });
        }

        function checkGameOver() {
            const stats = getPlayerStats();
            const playerTerritory = stats[0] || 0;
            const totalTerritory = Object.values(stats).reduce((a, b) => a + b, 0);

            // Win condition: player has 50%+ of all territory
            if (playerTerritory > gameState.totalCells * 0.5) {
                endGame(true);
                return true;
            }

            // Lose condition: player has 0 territory
            if (playerTerritory === 0) {
                endGame(false);
                return true;
            }

            return false;
        }

        function endGame(playerWon) {
            gameState.isRunning = false;
            const stats = getPlayerStats();
            const playerTerritory = stats[0] || 0;
            const percentage = ((playerTerritory / gameState.totalCells) * 100).toFixed(1);

            // Calculate rank and exp
            updatePlayerRanks();
            const player = gameState.players[0];
            const rank = player.rank;
            
            // Exp based on rank and victory
            let expEarned = 0;
            if (playerWon) {
                expEarned = 500 + (rank - 1) * 50;
            } else {
                expEarned = Math.max(50, 200 - (rank - 1) * 20);
            }

            showGameOverModal(playerWon, rank, percentage, expEarned);
        }

        function showGameOverModal(playerWon, rank, percentage, expEarned) {
            const modal = document.getElementById('gameOverModal');
            const modalContent = document.getElementById('modalContent');
            const title = document.getElementById('gameOverTitle');
            const rankInfo = document.getElementById('rankInfo');
            const expDisplay = document.getElementById('expEarned');

            if (playerWon) {
                modalContent.classList.add('victory');
                modalContent.classList.remove('defeat');
                title.textContent = '🎉 Victory!';
                rankInfo.innerHTML = `<strong>You conquered ${percentage}% of the world!</strong>`;
            } else {
                modalContent.classList.add('defeat');
                modalContent.classList.remove('victory');
                title.textContent = '💀 Defeated';
                rankInfo.innerHTML = `<strong>You ranked #${rank} with ${percentage}% territory</strong>`;
            }

            expDisplay.innerHTML = `+${expEarned} Experience Points`;
            modal.style.display = 'flex';
        }

        function updateUI() {
            const stats = getPlayerStats();
            const playerTerritory = stats[0] || 0;
            const percentage = ((playerTerritory / gameState.totalCells) * 100).toFixed(1);

            document.getElementById('playerTerritory').textContent = percentage + '%';
            
            updateLeaderboard();
        }

        function drawGame() {
            ctx.fillStyle = '#f5f5f5';
            ctx.fillRect(0, 0, gameState.width, gameState.height);

            // Draw grid
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= gameState.cols; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gameState.cellSize, 0);
                ctx.lineTo(i * gameState.cellSize, gameState.height);
                ctx.stroke();
            }
            for (let i = 0; i <= gameState.rows; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * gameState.cellSize);
                ctx.lineTo(gameState.width, i * gameState.cellSize);
                ctx.stroke();
            }

            // Draw cells
            for (let i = 0; i < gameState.cells.length; i++) {
                const owner = gameState.cells[i];
                if (owner !== null) {
                    const player = gameState.players[owner];
                    const col = i % gameState.cols;
                    const row = Math.floor(i / gameState.cols);

                    ctx.fillStyle = player.color;
                    ctx.fillRect(
                        col * gameState.cellSize + 1,
                        row * gameState.cellSize + 1,
                        gameState.cellSize - 2,
                        gameState.cellSize - 2
                    );
                }
            }
        }

        function gameLoop() {
            if (!gameState.isRunning) return;

            drawGame();
            updateUI();

            // Bot expansion
            gameState.players.forEach(player => {
                if (player.isBot) {
                    botExpand(player);
                }
            });

            // Check game over
            if (checkGameOver()) {
                return;
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        function exitGame() {
            gameState.isRunning = false;
            document.getElementById('gameOverModal').style.display = 'none';
            returnToMenu();
        }

        function returnToMenu() {
            gameState.isRunning = false;
            gameState.cells = [];
            gameState.players = [];
            document.getElementById('menuScreen').style.display = 'block';
            document.getElementById('gameContainer').style.display = 'none';
            document.getElementById('gameOverModal').style.display = 'none';
            document.getElementById('playerName').value = '';
            
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        }
    </script>
</body>
