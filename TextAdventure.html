<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Adventure Game</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        #gameContainer {
            max-width: 800px;
            margin: 0 auto;
            border: 2px solid #ffffff;
            padding: 20px;
            min-height: 500px;
        }
        #output {
            min-height: 300px;
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            max-height: 400px;
        }
        .inventory {
            border-top: 2px solid #ffffff;
            padding-top: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        input {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #cccccc;
        }
        .help-text {
            font-size: 12px;
            color: #cccccc;
            margin-top: 10px;
        }
        .status {
            font-size: 14px;
            color: #ffffff;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <h1>TEXT ADVENTURE GAME</h1>
        <div class="status" id="status"></div>
        <div id="output"></div>
        <div class="inventory" id="inventory"></div>
        <input type="text" id="commandInput" placeholder="Enter command...">
        <button onclick="submitCommand()">Execute</button>
        <div class="help-text">
            Commands: GO (direction), TAKE (item), DROP (item), INSPECT (target), INVENTORY, LOOK, HELP, QUIT, EQUIP, UNEQUIP, ATTACK, TRADE, USE (item)
        </div>
    </div>

    <script>
        // Game State
        let gameState = {
            currentRoom: null,
            inventory: [],
            equipped: { weapon: null, tool: null },
            visited: new Set(),
            world: {},
            gameOver: false,
            player: { hp: 100, maxHp: 100, baseDamage: 2, buffedDamageEndTurn: -1 },
            score: 0,
            enemiesDefeated: 0,
            itemsCollected: 0,
            turnCount: 0,
            playerPositionX: 0,
            playerPositionY: 0
        };

        // World Generation
        const roomTypes = ['forest', 'cave', 'ruins', 'clearing', 'stream', 'mountain', 'temple'];
        const items = [
            { name: 'torch', type: 'tool', value: 10, description: 'a flickering torch', equipSlot: 'tool' },
            { name: 'key', type: 'misc', value: 25, description: 'an ancient key' },
            { name: 'coin', type: 'currency', value: 1, description: 'a shiny coin' },
            { name: 'scroll', type: 'misc', value: 15, description: 'a dusty scroll' },
            { name: 'rope', type: 'tool', value: 12, description: 'a coil of rope', equipSlot: 'tool' },
            { name: 'gem', type: 'misc', value: 50, description: 'a sparkling gem' },
            { name: 'potion', type: 'consumable', value: 20, description: 'a mysterious potion' },
            { name: 'shield', type: 'armor', value: 30, description: 'a dented shield' },
            // Weapons
            { name: 'sword', type: 'weapon', value: 40, description: 'a sharp sword', damage: 10, equipSlot: 'weapon' },
            { name: 'dagger', type: 'weapon', value: 20, description: 'a small dagger', damage: 6, equipSlot: 'weapon' },
            { name: 'bow', type: 'weapon', value: 35, description: 'a longbow', damage: 8, equipSlot: 'weapon' }
        ];

        const enemyTypes = [
            { name: 'Goblin', hp: 20, damage: 4, lootChance: 0.6 },
            { name: 'Wolf', hp: 25, damage: 5, lootChance: 0.5 },
            { name: 'Bandit', hp: 30, damage: 6, lootChance: 0.7 }
        ];

        const merchantNames = ['Old Trader', 'Wandering Merchant', 'Peddler'];

        const directions = ['north', 'south', 'east', 'west'];

        const potionEffects = [
            { 
                name: 'Healing Potion', 
                effect: () => {
                    const healed = Math.min(30, gameState.player.maxHp - gameState.player.hp);
                    gameState.player.hp += healed;
                    return 'You feel rejuvenated! Healed ' + healed + ' HP.';
                }
            },
            { 
                name: 'Strength Potion', 
                effect: () => {
                    const boost = 5;
                    const currentTurn = gameState.turnCount;
                    gameState.player.buffedDamageEndTurn = currentTurn + 5;
                    gameState.player.baseDamage += boost;
                    return 'Your strength surges! Base damage +' + boost + ' for 5 turns.';
                }
            },
            { 
                name: 'Luck Potion', 
                effect: () => {
                    return 'You feel fortunate! Your next 3 item drops will be more valuable.';
                }
            },
            { 
                name: 'Poison Potion', 
                effect: () => {
                    const damage = 10;
                    gameState.player.hp -= damage;
                    return 'Uh oh! That was poison! You take ' + damage + ' damage.';
                }
            },
            { 
                name: 'Teleport Potion', 
                effect: () => {
                    const coordinates = Object.keys(gameState.world);
                    if (coordinates.length === 0) return 'The potion fizzles...';
                    const randomCoord = coordinates[Math.floor(Math.random() * coordinates.length)];
                    gameState.currentRoom = randomCoord;
                    const [x, y] = randomCoord.split(',').map(Number);
                    gameState.playerPositionX = x;
                    gameState.playerPositionY = y;
                    gameState.visited.add(randomCoord);
                    return 'The potion whisks you away to a different location!';
                }
            }
        ];

        function getRandomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateRoom(x, y) {
            const type = getRandomItem(roomTypes);
            const hasItem = Math.random() > 0.5;
            const item = hasItem ? { ...getRandomItem(items) } : null;
            const exits = {};

            // Create exits to adjacent rooms
            const neighbors = [
                { dir: 'north', dx: 0, dy: -1 },
                { dir: 'south', dx: 0, dy: 1 },
                { dir: 'east', dx: 1, dy: 0 },
                { dir: 'west', dx: -1, dy: 0 }
            ];

            neighbors.forEach(n => {
                if (Math.random() > 0.3) {
                    exits[n.dir] = { x: x + n.dx, y: y + n.dy };
                }
            });

            // Maybe merchant
            const merchant = Math.random() > 0.9 ? generateMerchant() : null;
            // Maybe enemy
            const enemies = Math.random() > 0.75 ? [generateEnemy()] : [];

            return {
                type: type,
                item: item,
                exits: exits,
                description: getDescription(type),
                merchant: merchant,
                enemies: enemies,
                ground: []
            };
        }

        function generateMerchant() {
            // Merchant has a small inventory and some coins
            const inv = [];
            const possible = items.filter(i => i.type !== 'currency');
            for (let i = 0; i < 3; i++) {
                inv.push({ ...getRandomItem(possible) });
            }
            // Merchant prices are based on item value
            const merchant = {
                name: getRandomItem(merchantNames),
                inventory: inv,
                coins: 100
            };
            return merchant;
        }

        function generateEnemy() {
            const base = getRandomItem(enemyTypes);
            const enemy = {
                name: base.name,
                hp: base.hp,
                maxHp: base.hp,
                damage: base.damage,
                lootChance: base.lootChance
            };
            return enemy;
        }

        function getDescription(type) {
            const descriptions = {
                forest: 'You are in a dense forest. Tall trees tower above you, blocking most of the light.',
                cave: 'You stand in a dark cave. Water drips echoing from somewhere in the distance.',
                ruins: 'Ancient ruins surround you. Crumbling stone structures hint at a forgotten civilization.',
                clearing: 'A small clearing opens before you. Grass and wildflowers sway in the breeze.',
                stream: 'A gentle stream flows nearby. The sound of water is soothing and peaceful.',
                mountain: 'You are on a rocky mountain slope. The wind is cold and sharp up here.',
                temple: 'A massive stone temple stands before you. Strange symbols cover its walls.'
            };
            return descriptions[type] || 'You are in an unknown place.';
        }

        function getOrCreateRoom(x, y) {
            const key = x + ',' + y;
            if (!gameState.world[key]) {
                gameState.world[key] = generateRoom(x, y);
            }
            return gameState.world[key];
        }

        function generateWorld() {
            gameState.world = {};
            gameState.currentRoom = '0,0';
            gameState.playerPositionX = 0;
            gameState.playerPositionY = 0;
            gameState.visited.add('0,0');
            getOrCreateRoom(0, 0);
        }

        // UI Functions
        function appendOutput(text) {
            const output = document.getElementById('output');
            output.textContent += text + '\n';
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            document.getElementById('output').textContent = '';
        }

        function updateInventoryDisplay() {
            const invDiv = document.getElementById('inventory');
            const eq = gameState.equipped;
            const weapon = eq.weapon ? eq.weapon.name : '(none)';
            const tool = eq.tool ? eq.tool.name : '(none)';

            if (gameState.inventory.length === 0) {
                invDiv.innerHTML = '<strong>Inventory:</strong> (empty)';
            } else {
                // Count items by name to avoid duplicates
                const itemCounts = {};
                gameState.inventory.forEach(item => {
                    if (!itemCounts[item.name]) {
                        itemCounts[item.name] = 0;
                    }
                    itemCounts[item.name]++;
                });

                // Build display string
                const itemsList = Object.keys(itemCounts).map(name => {
                    const count = itemCounts[name];
                    return name + (count > 1 ? ' (x' + count + ')' : '');
                }).join(', ');

                invDiv.innerHTML = '<strong>Inventory:</strong> ' + itemsList + '<br><strong>Equipped:</strong> Weapon: ' + weapon + ' | Tool: ' + tool;
            }
            updateStatus();
        }

        function updateStatus() {
            const status = document.getElementById('status');
            const room = gameState.world[gameState.currentRoom];
            const locationName = room ? room.type : 'unknown';
            status.textContent = 'HP: ' + gameState.player.hp + '/' + gameState.player.maxHp + '  |  Turns: ' + gameState.turnCount + '  |  Location: ' + locationName + ' (' + gameState.playerPositionX + ',' + gameState.playerPositionY + ')  |  Score: ' + gameState.score;
        }

        function calculateScore() {
            let score = 0;
            // Base score from inventory value
            gameState.inventory.forEach(item => {
                score += item.value || 0;
            });
            // Bonus for enemies defeated
            score += gameState.enemiesDefeated * 50;
            // Bonus for items collected
            score += gameState.itemsCollected * 10;
            // Bonus for rooms visited
            score += gameState.visited.size * 5;
            return score;
        }

        // Game Commands
        function handleCommand(input) {
            const parts = input.toLowerCase().trim().split(' ');
            const command = parts[0];
            const arg = parts.slice(1).join(' ');

            switch (command) {
                case 'look':
                    cmdLook();
                    break;
                case 'go':
                    cmdGo(arg);
                    break;
                case 'take':
                    cmdTake(arg);
                    break;
                case 'drop':
                    cmdDrop(arg);
                    break;
                case 'inspect':
                    cmdInspect(arg);
                    break;
                case 'inventory':
                    cmdInventory();
                    break;
                case 'help':
                    cmdHelp();
                    break;
                case 'quit':
                    cmdQuit();
                    break;
                case 'equip':
                    cmdEquip(arg);
                    break;
                case 'unequip':
                    cmdUnequip(arg);
                    break;
                case 'attack':
                case 'fight':
                    cmdAttack(arg);
                    break;
                case 'trade':
                    cmdTrade(arg);
                    break;
                case 'use':
                    cmdUse(arg);
                    break;
                default:
                    appendOutput('Unknown command: "' + command + '". Type HELP for available commands.');
            }
        }

        function cmdLook() {
            const room = gameState.world[gameState.currentRoom];
            let text = '\n=== ' + room.type.toUpperCase() + ' ===\n';
            text += room.description + '\n';

            if (room.exits && Object.keys(room.exits).length > 0) {
                const exits = Object.keys(room.exits);
                text += 'Exits: ' + exits.join(', ') + '\n';
            }

            if (room.item) {
                text += 'You see ' + room.item.description + ' here. (' + room.item.name + ')\n';
            }

            if (room.ground && room.ground.length > 0) {
                text += 'Items on ground: ' + room.ground.map(i => i.name).join(', ') + '\n';
            }

            if (room.merchant) {
                text += 'A merchant is here: ' + room.merchant.name + '. You can TRADE.\n';
            }

            if (room.enemies && room.enemies.length > 0) {
                const names = room.enemies.map(e => e.name + ' (HP:' + e.hp + ')');
                text += 'Enemies here: ' + names.join(', ') + '\n';
            }

            appendOutput(text);
            updateInventoryDisplay();
        }

        function cmdGo(direction) {
            if (!direction) {
                appendOutput('Go where? Specify a direction: north, south, east, west.');
                return;
            }

            const room = gameState.world[gameState.currentRoom];
            if (!room.exits || !room.exits[direction]) {
                appendOutput('You cannot go ' + direction + ' from here.');
                return;
            }

            const nextCoord = room.exits[direction];
            gameState.currentRoom = nextCoord.x + ',' + nextCoord.y;
            gameState.playerPositionX = nextCoord.x;
            gameState.playerPositionY = nextCoord.y;
            gameState.visited.add(gameState.currentRoom);
            gameState.turnCount++;

            // Check if buff ended
            checkBuffExpired();

            appendOutput('You travel ' + direction + '...\n');

            // Get or create the new room
            const newRoom = getOrCreateRoom(nextCoord.x, nextCoord.y);
            if (!newRoom.merchant && Math.random() > 0.92) {
                newRoom.merchant = generateMerchant();
                appendOutput('You notice a merchant has arrived.\n');
            }
            if ((newRoom.enemies || []).length === 0 && Math.random() > 0.8) {
                newRoom.enemies.push(generateEnemy());
                appendOutput('You sense danger nearby...\n');
            }

            cmdLook();
        }

        function cmdTake(itemName) {
            if (!itemName) {
                const room = gameState.world[gameState.currentRoom];
                const availableItems = [];
                if (room.item) availableItems.push(room.item.name);
                if (room.ground) room.ground.forEach(i => availableItems.push(i.name));
                if (availableItems.length === 0) {
                    appendOutput('There are no items here to take.');
                } else {
                    appendOutput('You can take: ' + availableItems.join(', '));
                }
                return;
            }

            const room = gameState.world[gameState.currentRoom];
            
            // Check room item first
            if (room.item && room.item.name === itemName) {
                gameState.inventory.push(room.item);
                gameState.itemsCollected++;
                appendOutput('You took ' + room.item.description + '.');
                room.item = null;
                gameState.turnCount++;
                checkBuffExpired();
                updateInventoryDisplay();
                return;
            }

            // Check ground items
            if (room.ground) {
                const groundIndex = room.ground.findIndex(i => i.name === itemName);
                if (groundIndex !== -1) {
                    const item = room.ground.splice(groundIndex, 1)[0];
                    gameState.inventory.push(item);
                    gameState.itemsCollected++;
                    appendOutput('You took ' + item.description + '.');
                    gameState.turnCount++;
                    checkBuffExpired();
                    updateInventoryDisplay();
                    return;
                }
            }

            appendOutput('You don\'t see "' + itemName + '" here.');
        }

        function cmdDrop(itemName) {
            if (!itemName) {
                if (gameState.inventory.length === 0) {
                    appendOutput('You don\'t have anything to drop.');
                } else {
                    const itemsList = gameState.inventory.map(i => i.name).join(', ');
                    appendOutput('You can drop: ' + itemsList);
                }
                return;
            }

            const index = gameState.inventory.findIndex(i => i.name === itemName);
            if (index === -1) {
                appendOutput('You don\'t have "' + itemName + '" in your inventory.');
                return;
            }

            const droppedItem = gameState.inventory.splice(index, 1)[0];
            const room = gameState.world[gameState.currentRoom];
            room.ground.push(droppedItem);
            appendOutput('You dropped ' + droppedItem.description + '.');
            gameState.turnCount++;
            checkBuffExpired();
            updateInventoryDisplay();
        }

        function cmdInspect(target) {
            if (!target) {
                const room = gameState.world[gameState.currentRoom];
                const inspectable = [];

                // Add inventory items (unique names only)
                const seenNames = new Set();
                gameState.inventory.forEach(item => {
                    if (!seenNames.has(item.name)) {
                        inspectable.push(item.name);
                        seenNames.add(item.name);
                    }
                });

                // Add room item
                if (room.item) {
                    inspectable.push(room.item.name);
                }

                if (room.ground) room.ground.forEach(i => {
                    if (!seenNames.has(i.name)) {
                        inspectable.push(i.name);
                        seenNames.add(i.name);
                    }
                });

                if (inspectable.length === 0) {
                    appendOutput('There is nothing to inspect here.');
                } else {
                    appendOutput('You can inspect: ' + inspectable.join(', '));
                }
                return;
            }

            const room = gameState.world[gameState.currentRoom];

            // Check inventory
            const invItem = gameState.inventory.find(i => i.name === target);
            if (invItem) {
                let extra = '';
                if (invItem.type === 'weapon') extra = ' Damage: ' + invItem.damage + '.';
                appendOutput('You examine ' + invItem.description + '.' + extra + ' (Worth ' + invItem.value + ' points)');
                return;
            }

            // Check room item
            if (room.item && room.item.name === target) {
                const r = room.item;
                let extra = '';
                if (r.type === 'weapon') extra = ' Damage: ' + r.damage + '.';
                appendOutput('You examine ' + r.description + '.' + extra + ' (Worth ' + r.value + ' points)');
                return;
            }

            // Check ground
            if (room.ground) {
                const groundItem = room.ground.find(i => i.name === target);
                if (groundItem) {
                    appendOutput('You examine ' + groundItem.description + '.');
                    return;
                }
            }

            // Check surroundings
            if (target === 'surroundings' || target === 'room') {
                cmdLook();
                return;
            }

            appendOutput('You don\'t see anything called "' + target + '" here.');
        }

        function cmdInventory() {
            if (gameState.inventory.length === 0) {
                appendOutput('Your inventory is empty.');
                return;
            }

            let text = '\n=== YOUR INVENTORY ===\n';
            let totalValue = 0;
            const counts = {};
            gameState.inventory.forEach(item => {
                counts[item.name] = (counts[item.name] || 0) + 1;
                totalValue += item.value || 0;
            });
            for (let name in counts) {
                const item = gameState.inventory.find(i => i.name === name);
                text += '- ' + name + ' x' + counts[name] + (item.type === 'weapon' ? ' (weapon, dmg ' + item.damage + ')' : '') + '\n';
            }
            text += '\nTotal value: ' + totalValue + ' points';
            appendOutput(text);
        }

        function cmdHelp() {
            const helpText = `
=== AVAILABLE COMMANDS ===
LOOK           - Examine your current location
GO [direction] - Move in a direction (north, south, east, west)
TAKE [item]    - Pick up an item
DROP [item]    - Drop an item from your inventory
INSPECT [item] - Examine an item closely
INVENTORY      - Check what you're carrying
EQUIP [item]   - Equip a weapon or tool
UNEQUIP [slot] - Unequip weapon or tool
ATTACK [enemy] - Attack an enemy in the room
TRADE [buy/sell item] - Trade with a merchant if present
USE [item]     - Use a consumable item (like potion)
HELP           - Show this message
QUIT           - End the game
`;
            appendOutput(helpText);
        }

        function cmdQuit() {
            gameState.gameOver = true;
            gameState.score = calculateScore();
            appendOutput('\nThanks for playing!');
            appendOutput('Final Score: ' + gameState.score);
            document.getElementById('commandInput').disabled = true;
        }

        // USE command for potions
        function cmdUse(itemName) {
            if (!itemName) {
                const consumables = gameState.inventory.filter(i => i.type === 'consumable');
                if (consumables.length === 0) {
                    appendOutput('You have no consumable items to use.');
                } else {
                    appendOutput('You can use: ' + consumables.map(i => i.name).join(', '));
                }
                return;
            }

            const index = gameState.inventory.findIndex(i => i.name === itemName && i.type === 'consumable');
            if (index === -1) {
                appendOutput('You don\'t have a consumable item called "' + itemName + '".');
                return;
            }

            const potion = gameState.inventory[index];
            const effect = getRandomItem(potionEffects);
            const message = effect.effect();
            appendOutput('You drink ' + potion.description + '.');
            appendOutput(effect.name + ': ' + message);
            
            gameState.inventory.splice(index, 1);
            gameState.turnCount++;
            checkBuffExpired();
            updateInventoryDisplay();
        }

        function checkBuffExpired() {
            if (gameState.player.buffedDamageEndTurn !== -1 && gameState.turnCount >= gameState.player.buffedDamageEndTurn) {
                gameState.player.baseDamage -= 5;
                gameState.player.buffedDamageEndTurn = -1;
                appendOutput('Your strength boost has worn off!');
            }
        }

        // EQUIP/UNEQUIP
        function cmdEquip(itemName) {
            if (!itemName) {
                appendOutput('Equip what? Specify an item in your inventory (weapon or tool).');
                return;
            }
            const idx = gameState.inventory.findIndex(i => i.name === itemName);
            if (idx === -1) {
                appendOutput('You don\'t have "' + itemName + '".');
                return;
            }
            const item = gameState.inventory[idx];
            if (!item.equipSlot) {
                appendOutput('You cannot equip "' + itemName + '".');
                return;
            }

            const slot = item.equipSlot;
            // Unequip existing item in that slot
            if (gameState.equipped[slot]) {
                gameState.inventory.push(gameState.equipped[slot]);
                appendOutput('You unequipped ' + gameState.equipped[slot].name + '.');
            }

            // Remove from inventory
            gameState.inventory.splice(idx, 1);
            gameState.equipped[slot] = item;
            appendOutput('You equipped ' + item.name + '.');
            updateInventoryDisplay();
        }

        function cmdUnequip(slotName) {
            if (!slotName) {
                appendOutput('Specify slot to unequip: weapon or tool.');
                return;
            }
            const slot = slotName.toLowerCase();
            if (!['weapon', 'tool'].includes(slot)) {
                appendOutput('Unknown slot: ' + slotName + '. Use weapon or tool.');
                return;
            }
            if (!gameState.equipped[slot]) {
                appendOutput('Nothing is equipped in ' + slot + '.');
                return;
            }
            const item = gameState.equipped[slot];
            gameState.inventory.push(item);
            gameState.equipped[slot] = null;
            appendOutput('You unequipped ' + item.name + '.');
            updateInventoryDisplay();
        }

        // Combat
        function cmdAttack(targetName) {
            const room = gameState.world[gameState.currentRoom];
            if (!room.enemies || room.enemies.length === 0) {
                appendOutput('There are no enemies here to attack.');
                return;
            }

            let enemy;
            if (!targetName) {
                enemy = room.enemies[0];
            } else {
                enemy = room.enemies.find(e => e.name.toLowerCase() === targetName.toLowerCase());
            }
            if (!enemy) {
                appendOutput('No such enemy here: ' + (targetName || '') );
                return;
            }

            appendOutput('You engage ' + enemy.name + '!');

            // Simple turn-based fight until one side dies
            const playerTurn = () => {
                if (gameState.player.hp <= 0) return;
                checkBuffExpired();
                const weapon = gameState.equipped.weapon;
                const base = gameState.player.baseDamage;
                const damage = weapon ? (base + (weapon.damage || 0)) : base;
                enemy.hp -= damage;
                appendOutput('You hit ' + enemy.name + ' for ' + damage + ' damage. (' + Math.max(0, enemy.hp) + ' HP left)');
                gameState.turnCount++;
                if (enemy.hp <= 0) {
                    appendOutput('You defeated ' + enemy.name + '!');
                    gameState.enemiesDefeated++;
                    gameState.score += 50;
                    // Loot drop
                    if (Math.random() < enemy.lootChance) {
                        const loot = { ...getRandomItem(items) };
                        // give some chance to drop coins specifically
                        if (Math.random() > 0.6) loot = { name: 'coin', type: 'currency', value: 1, description: 'a shiny coin' };
                        room.ground.push(loot);
                        appendOutput(enemy.name + ' dropped: ' + loot.name + '.');
                    }
                    // remove enemy
                    const idx = room.enemies.indexOf(enemy);
                    if (idx !== -1) room.enemies.splice(idx, 1);
                    updateInventoryDisplay();
                    return;
                }
                // enemy turn
                setTimeout(enemyTurn, 600);
            };

            const enemyTurn = () => {
                if (enemy.hp <= 0 || gameState.player.hp <= 0) return;
                const ed = enemy.damage;
                gameState.player.hp -= ed;
                appendOutput(enemy.name + ' hits you for ' + ed + ' damage. (You: ' + Math.max(0, gameState.player.hp) + ' HP left)');
                gameState.turnCount++;
                updateStatus();
                if (gameState.player.hp <= 0) {
                    gameState.score = calculateScore();
                    appendOutput('You have been slain. Game over.');
                    appendOutput('\n=== FINAL SCORE ===');
                    appendOutput('Total Score: ' + gameState.score);
                    appendOutput('Enemies Defeated: ' + gameState.enemiesDefeated);
                    appendOutput('Rooms Explored: ' + gameState.visited.size);
                    appendOutput('Items Collected: ' + gameState.itemsCollected);
                    gameState.gameOver = true;
                    document.getElementById('commandInput').disabled = true;
                    return;
                }
                // back to player
                setTimeout(playerTurn, 600);
            };

            // start combat
            playerTurn();
        }

        // Trading
        function cmdTrade(arg) {
            const room = gameState.world[gameState.currentRoom];
            if (!room.merchant) {
                appendOutput('There is no merchant here to trade with.');
                return;
            }

            if (!arg) {
                // show merchant inventory
                let text = 'Merchant (' + room.merchant.name + ') offers:\n';
                room.merchant.inventory.forEach(it => {
                    const price = Math.max(1, Math.floor((it.value || 1) * 1.2));
                    text += '- ' + it.name + ' : ' + price + ' coins\n';
                });
                text += 'Use TRADE BUY [item] or TRADE SELL [item] to trade.';
                appendOutput(text);
                return;
            }

            const parts = arg.split(' ');
            const action = parts[0];
            const itemName = parts.slice(1).join(' ');
            if (action === 'buy') {
                const offer = room.merchant.inventory.find(i => i.name.toLowerCase() === itemName.toLowerCase());
                if (!offer) { appendOutput('Merchant does not offer that item.'); return; }
                const price = Math.max(1, Math.floor((offer.value || 1) * 1.2));
                const coins = gameState.inventory.filter(i => i.type === 'currency');
                const coinCount = coins.length;
                if (coinCount < price) { appendOutput('You need ' + price + ' coins to buy ' + offer.name + '. You have ' + coinCount + '.'); return; }
                // remove coins
                let removed = 0;
                for (let i = gameState.inventory.length-1; i >=0 && removed < price; i--) {
                    if (gameState.inventory[i].type === 'currency') { gameState.inventory.splice(i,1); removed++; }
                }
                // give item
                gameState.inventory.push({ ...offer });
                appendOutput('You bought ' + offer.name + ' for ' + price + ' coins.');
                // merchant removes sold item and gets coins
                const idx = room.merchant.inventory.indexOf(offer);
                if (idx !== -1) room.merchant.inventory.splice(idx,1);
                gameState.turnCount++;
                checkBuffExpired();
                updateInventoryDisplay();
                return;
            } else if (action === 'sell') {
                const idx = gameState.inventory.findIndex(i => i.name.toLowerCase() === itemName.toLowerCase());
                if (idx === -1) { appendOutput('You don\'t have that to sell.'); return; }
                const item = gameState.inventory[idx];
                const price = Math.max(1, Math.floor((item.value || 1) * 0.6));
                // remove item from player
                gameState.inventory.splice(idx,1);
                // give coins
                for (let i = 0; i < price; i++) gameState.inventory.push({ name: 'coin', type: 'currency', value: 1, description: 'a shiny coin' });
                appendOutput('You sold ' + item.name + ' for ' + price + ' coins.');
                // merchant takes item
                room.merchant.inventory.push(item);
                gameState.turnCount++;
                checkBuffExpired();
                updateInventoryDisplay();
                return;
            } else {
                appendOutput('Unknown trade action. Use TRADE BUY [item] or TRADE SELL [item].');
            }
        }

        // Main Game Loop
        function submitCommand() {
            if (gameState.gameOver) return;

            const input = document.getElementById('commandInput').value.trim();
            if (!input) return;

            appendOutput('> ' + input);
            handleCommand(input);
            document.getElementById('commandInput').value = '';
            document.getElementById('commandInput').focus();
        }

        function initGame() {
            clearOutput();
            generateWorld();
            // Give player a few starter items
            gameState.inventory.push({ name: 'coin', type: 'currency', value: 1, description: 'a shiny coin' });
            gameState.inventory.push({ name: 'coin', type: 'currency', value: 1, description: 'a shiny coin' });
            gameState.inventory.push({ name: 'dagger', type: 'weapon', value: 20, description: 'a small dagger', damage: 6, equipSlot: 'weapon' });
            gameState.itemsCollected += 3;
            gameState.turnCount = 0;

            gameState.score = calculateScore();
            appendOutput('=== TEXT ADVENTURE GAME ===\n');
            appendOutput('Welcome, adventurer! You find yourself in a strange land.\n');
            appendOutput('Type HELP for a list of commands.\n');
            cmdLook();
            updateInventoryDisplay();
            document.getElementById('commandInput').focus();
        }

        // Allow Enter key to submit
        document.getElementById('commandInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitCommand();
            }
        });

        // Start the game when page loads
        window.addEventListener('load', initGame);
    </script>
</body>
